# Configuração do pytest para a pasta App (material 15_testes.py)
[pytest]
# Só procura testes na pasta tests/ (o Server/ tem a configuração dele)
testpaths = tests
# Coloca a pasta App no sys.path, para os testes conseguirem
# fazer "from loja.precos import ..."
pythonpath = .
# Avisos de depreciação que vêm de DENTRO das bibliotecas usadas pelo
# TestClient do FastAPI (não do nosso código). Filtramos só estes, pela
# mensagem, para não esconder avisos que importam.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
